<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="../CSS/Change_password.css" rel="stylesheet">
</head>

<body>
    <main class="container">
        <div class="action-links">
            <button type="button" onclick="history.back()" class="btn-text">이전으로</button>
            <a href="/login">로그인 페이지로</a>
        </div>

        <div class="brand">
            <p class="eyebrow">Account Recovery</p>
            <h1>Change Password</h1>
        </div>

        <form action="/Find-Password" method="post" autocomplete="off">
            <input type="text" id="username" name="username" placeholder="Input your username" required autocomplete="off">
            <input type="email" id="email" name="email" placeholder="Input your Email" required autocomplete="off">
            <button type="button" id="Code">인증코드 받기</button>
            <input type="number" name="input" placeholder="Input your Code" required autocomplete="one-time-code">
            <input type="password" name="newpassword" placeholder="Input your new password" required autocomplete="new-password">
            <input type="password" name="againpassword" placeholder="Input your new password again" required autocomplete="new-password">
            <button type="submit">Change Password</button>
        </form>

        <a href="/"><button class="btn-home">Home</button></a>
    </main>

    <script type="module" src="../JS/core-ui.js"></script>
</body>

</html>
